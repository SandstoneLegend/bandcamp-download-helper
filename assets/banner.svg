<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1b26"/>
      <stop offset="0.55" stop-color="#122f3d"/>
      <stop offset="1" stop-color="#0a2a33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#4fd1c5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4fd1c5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vinyl" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#2c3e46"/>
      <stop offset="0.55" stop-color="#141d21"/>
      <stop offset="1" stop-color="#05080a"/>
    </radialGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5be7d0"/>
      <stop offset="1" stop-color="#1f8fa3"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63f0d6"/>
      <stop offset="1" stop-color="#1a5f6e"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ff5e2"/>
      <stop offset="1" stop-color="#2fb3a0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="360" fill="url(#glow)"/>

  <!-- faint concentric sound ripples -->
  <circle cx="930" cy="150" r="180" fill="none" stroke="#3ba9a0" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="930" cy="150" r="230" fill="none" stroke="#3ba9a0" stroke-opacity="0.06" stroke-width="2"/>
  <circle cx="930" cy="150" r="280" fill="none" stroke="#3ba9a0" stroke-opacity="0.04" stroke-width="2"/>

  <!-- vinyl record -->
  <g>
    <circle cx="930" cy="150" r="140" fill="url(#vinyl)" stroke="#0a1418" stroke-width="4"/>
    <circle cx="930" cy="150" r="122" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="930" cy="150" r="104" fill="none" stroke="#000" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="930" cy="150" r="86" fill="none" stroke="#000" stroke-opacity="0.28" stroke-width="1"/>
    <circle cx="930" cy="150" r="68" fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="1"/>
    <circle cx="930" cy="150" r="50" fill="url(#label)"/>
    <circle cx="930" cy="150" r="8" fill="#0a1418"/>
    <circle cx="930" cy="150" r="140" fill="none" stroke="#4fd1c5" stroke-opacity="0.25" stroke-width="1.5"/>
  </g>

  <!-- tonearm -->
  <g stroke="#8fd8cf" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M 1075 45 Q 1010 80 965 128" />
  </g>
  <circle cx="1075" cy="45" r="12" fill="#5be7d0"/>
  <circle cx="965" cy="128" r="6" fill="#5be7d0"/>

  <!-- download arrow into disc -->
  <g>
    <path d="M 930 190 L 930 250 M 908 228 L 930 252 L 952 228" stroke="url(#arrow)" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <!-- waveform bars along bottom -->
  <g fill="url(#bar)" opacity="0.85">
    <rect x="60"  y="300" width="10" height="20" rx="2"/>
    <rect x="78"  y="286" width="10" height="34" rx="2"/>
    <rect x="96"  y="294" width="10" height="26" rx="2"/>
    <rect x="114" y="278" width="10" height="42" rx="2"/>
    <rect x="132" y="290" width="10" height="30" rx="2"/>
    <rect x="150" y="270" width="10" height="50" rx="2"/>
    <rect x="168" y="284" width="10" height="36" rx="2"/>
    <rect x="186" y="296" width="10" height="24" rx="2"/>
    <rect x="204" y="288" width="10" height="32" rx="2"/>
    <rect x="222" y="300" width="10" height="20" rx="2"/>
    <rect x="240" y="292" width="10" height="28" rx="2"/>
  </g>

  <!-- headline -->
  <text x="60" y="150" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="72" fill="#f2fdfb" letter-spacing="1">
    <tspan x="60" y="150" textLength="620" lengthAdjust="spacingAndGlyphs">Bandcamp</tspan>
    <tspan x="60" y="228" textLength="560" lengthAdjust="spacingAndGlyphs">Downloader</tspan>
  </text>

  <!-- tagline -->
  <text x="60" y="266" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#a8d9d2" textLength="700" lengthAdjust="spacingAndGlyphs">
    Downloads Bandcamp albums with built-in tagging and artwork
  </text>
  <text x="60" y="296" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#5be7d0" font-weight="600" textLength="260" lengthAdjust="spacingAndGlyphs">
    — single binary
  </text>
</svg>